      jwt-secret: ${SPRING_SECURITY_OAUTH2_JWT_SECRET:b8f58b1cebdb1a92ff7c13b1697520b215b4e094328345ef73c06754fe1a919f}
  springdoc:
    swagger-ui:
      enabled: true